name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to publish from'
        required: true
        default: 'main'
        type: string
      agent_tests_passed:
        description: 'Agent tests (A*) verified in a Claude Code session (see tests/Agent.tests.md)'
        required: true
        type: boolean
        default: false
      manual_tests_passed:
        description: 'Human tests (H*) verified in an interactive terminal (see tests/Manual.tests.md)'
        required: true
        type: boolean
        default: false
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      publish_npm:
        description: 'Also publish to npm (after the tag and GitHub Release are created)'
        required: false
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Validate branch name
      run: |
        BRANCH="${{ inputs.branch }}"
        if [[ ! "$BRANCH" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
          echo "::error::Invalid branch name: '$BRANCH'"
          exit 1
        fi

    - name: Validate bump type
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        if [[ ! "$BUMP" =~ ^(patch|minor|major)$ ]]; then
          echo "::error::Invalid bump type: '$BUMP' (expected patch, minor or major)"
          exit 1
        fi

    - name: Verify manual test gates
      run: |
        if [[ "${{ inputs.agent_tests_passed }}" != "true" ]]; then
          echo "::error::Agent tests (A*) must be verified before publishing. See tests/Agent.tests.md"
          exit 1
        fi
        if [[ "${{ inputs.manual_tests_passed }}" != "true" ]]; then
          echo "::error::Human tests (H*) must be verified before publishing. See tests/Manual.tests.md"
          exit 1
        fi

  publish:
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      tag: v${{ steps.version.outputs.version }}

    permissions:
      contents: write
      id-token: write

    steps:
    # Pin the release to the branch tip at the moment Release was pressed
    # (github.sha, when dispatched from that branch) so a merge that lands
    # while `validate` runs isn't picked up. To release an exact set of
    # changes, dispatch with `branch` set to a validation branch.
    # Expression `==` ignores case, so compare in bash (case-sensitive).
    - name: Resolve release ref
      id: ref
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        if [[ "$GITHUB_REF" == "refs/heads/$BRANCH" ]]; then
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        else
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.ref.outputs.ref }}
        ssh-key: ${{ secrets.DEPLOY_KEY }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Typecheck
      run: npm run typecheck

    - name: Test
      run: npm test

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    # The release is the commit checked out above (pinned at dispatch) plus a
    # version bump, and nothing else: the tag always points at the tree this
    # job built and tested. If the branch moved meanwhile (a PR merged after
    # dispatch), the branch is linear-history + squash-only, so instead of
    # merging we push a separate version-bump commit onto the new tip so the
    # next release bumps from the right version. That commit carries only
    # package.json/package-lock.json version fields, never code, so it needs
    # no rebuild. The tag then sits on a commit beside the branch, not on it.
    - name: Bump version, push commit and tag
      id: version
      env:
        BUMP: ${{ inputs.bump }}
        BRANCH: ${{ inputs.branch }}
      run: |
        PINNED="$(git rev-parse HEAD)"
        FROM_VERSION="$(node -p 'require("./package.json").version')"
        npm version "$BUMP" -m "release: v%s"
        VERSION="$(node -p 'require("./package.json").version')"
        TAG="v$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
          echo "::error::Tag $TAG already exists on origin; delete it or bump differently."
          exit 1
        fi

        # Fast path: the branch hasn't moved, so tag and bump land on it together.
        if git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$TAG"; then
          exit 0
        fi

        for attempt in 1 2 3; do
          git fetch origin "$BRANCH"
          TIP="$(git rev-parse FETCH_HEAD)"
          if [[ "$TIP" == "$PINNED" ]]; then
            echo "::error::Push was rejected but $BRANCH has not moved; see the push error above."
            exit 1
          fi
          TIP_VERSION="$(git show "$TIP:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')"
          if [[ "$TIP_VERSION" != "$FROM_VERSION" ]]; then
            echo "::error::$BRANCH is now at version $TIP_VERSION (expected $FROM_VERSION); another release landed."
            exit 1
          fi
          echo "::notice::$BRANCH moved past the pinned commit ${PINNED:0:8}; tagging $TAG on the pinned commit and pushing only the version bump onto $BRANCH."
          git log --oneline "$PINNED..$TIP"
          git checkout --quiet --detach "$TIP"
          npm version "$VERSION" --no-git-tag-version
          git commit --quiet -am "release: $TAG"
          if git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$TAG"; then
            # Back to the pinned release tree so later steps (npm publish
            # packs src/templates, docker) never see the newer tip's files.
            git checkout --quiet "refs/tags/$TAG"
            exit 0
          fi
        done
        echo "::error::$BRANCH kept moving; gave up pushing the version bump after 3 attempts."
        exit 1

    # A draft: the repo has immutable releases, so once published nothing can
    # be attached. The `images` job adds march-stack.json to the draft and
    # `release` publishes it last.
    - name: Create draft GitHub Release with auto-generated notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "v${{ steps.version.outputs.version }}" \
          --title "v${{ steps.version.outputs.version }}" \
          --generate-notes \
          --draft

    - name: Publish to npm
      if: ${{ inputs.publish_npm }}
      run: npm publish

  # Prebuilt service images on GHCR + the `march-stack.json` release asset, so a
  # host can install the release by pulling instead of building (issue #438).
  # Runs after the tag and the draft GitHub Release exist; it adds images and
  # one release asset and changes nothing the npm package or the release notes
  # contain.
  images:
    needs: publish
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      latest: true

  # Publish the draft only once its march-stack.json is attached: a published
  # release is immutable. If `images` fails the release stays a draft; fix and
  # "Re-run failed jobs" (or run publish-images for the tag, then publish the
  # draft by hand).
  release:
    needs: [publish, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Publish the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.publish.outputs.tag }}
      run: gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
