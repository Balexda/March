# Tessera is the stack's ONLY GitHub credential source. Provision it first:
#   march tessera provision --from-gh      # writes ~/.march/tessera
# That directory (client key digests, policy, the operator token) is mounted
# read-only. With a GitHub App configured (TESSERA_GITHUB_APP_ID + the PEM at
# ~/.march/tessera/github-app.pem) the app slot mints installation tokens;
# otherwise it vends the operator token from github-token (interim). Startup
# fails if clients.json / policy.json are missing.
# No HOME, Docker socket, ambient GH_TOKEN or GITHUB_TOKEN enters this service.
# Residual risk: a peer with the host Docker socket can still inspect containers
# and their secrets; host steward processes retain operator-level host access.
# This compose boundary does not remove either risk.
# Start the observability stack first to create the external march network.
name: march-tessera
services:
  tessera:
    build:
      context: ..
      dockerfile: docker/tessera.Dockerfile
      args:
        MARCH_GIT_SHA: "${MARCH_GIT_SHA:-}"
        MARCH_GIT_DESCRIBE: "${MARCH_GIT_DESCRIBE:-}"
        MARCH_BUILD_TIME: "${MARCH_BUILD_TIME:-}"
    image: march-tessera:latest
    container_name: march-tessera
    # Run as the host user, like the sibling services: the provisioned files
    # below are 0600 and owned by that user.
    user: "${MARCH_HOST_UID:-1000}:${MARCH_HOST_GID:-${MARCH_HOST_UID:-1000}}"
    restart: on-failure
    command: ["tessera", "serve", "--host", "0.0.0.0", "--port", "${MARCH_TESSERA_PORT:-9477}"]
    ports:
      - "127.0.0.1:${MARCH_TESSERA_PORT:-9477}:${MARCH_TESSERA_PORT:-9477}"
    environment:
      - MARCH_TESSERA_PORT=${MARCH_TESSERA_PORT:-9477}
      - MARCH_TESSERA_LOG_DIR=/march/logs
      - MARCH_OTEL=${MARCH_OTEL:-1}
      - MARCH_OTEL_ENDPOINT=http://otel-lgtm:4318
      - MARCH_OTEL_SERVICE_NAME=march-tessera
      - TESSERA_CLIENT_KEYS_FILE=/march/tessera/clients.json
      - TESSERA_POLICY_FILE=/march/tessera/policy.json
      # Interim operator token (`gh auth token`), used only while no App is set.
      - TESSERA_GITHUB_TOKEN_FILE=/march/tessera/github-token
      # The goal: a GitHub App. Empty id leaves the App unconfigured.
      - TESSERA_GITHUB_APP_ID=${TESSERA_GITHUB_APP_ID:-}
      - TESSERA_GITHUB_APP_KEY_FILE=/march/tessera/github-app.pem
      - TESSERA_GITHUB_INSTALLATION_ID=${TESSERA_GITHUB_INSTALLATION_ID:-}
    volumes:
      - march-tessera-logs:/march/logs
      # Provisioned config + keys (`march tessera provision`), read-only. The
      # files are 0600 and owned by the host user, which the `user:` mapping
      # above (MARCH_HOST_UID/GID) runs the service as.
      - ${MARCH_HOST_HOME:-/home/jmbattista}/.march/tessera:/march/tessera:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${MARCH_TESSERA_PORT:-9477}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - march
networks:
  march:
    external: true
    name: march
volumes:
  march-tessera-logs:
