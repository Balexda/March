# Tessera service — the credential entitlement service over HTTP.
#
#   # 1. observability stack first (creates the `march` network):
#   docker compose -f docker/otel-lgtm.docker-compose.yml up -d
#   # 2. build + run tessera (from the repo root):
#   npm run build:tessera-image
#   docker compose -f docker/tessera.docker-compose.yml up -d
#   curl -fsS http://localhost:${MARCH_TESSERA_PORT:-9477}/healthz
#
# Consumers on the host reach Tessera at
# http://localhost:${MARCH_TESSERA_PORT:-9477}. Every /v1/* request must send
# `Authorization: Bearer <client key>` for a registered client; a missing or
# unknown key gets 401 `unauthorized`. /healthz and /status need no key.
#
# CLIENT KEYS (REQUIRED): the service REFUSES TO START (exit status 2) until
# you supply a client-keys file. Set
#   TESSERA_CLIENT_KEYS_FILE        path INSIDE the container to the
#                                   client-keys file, and add a read-only bind
#                                   mount for that one file yourself in a
#                                   compose override. Keep the host copy
#                                   OUTSIDE $HOME, for the same reason as the
#                                   App key below.
# The file is a JSON array of {"client": "<name>", "key_sha256": "<hex>"}
# rows. It holds only SHA-256 hashes of the keys, never the keys themselves.
# Make a key with `KEY="$(openssl rand -hex 32)"` and its hash with
# `printf %s "$KEY" | sha256sum` (printf, not echo: the hash must not include a
# newline; the first 64 characters of the output are the key_sha256). The file
# is read once at startup; restart after changing it. The format and rules are
# in docs/subsystems/tessera/contract.md.
# Without the file each start attempt exits with status 2, and because of
# `restart: on-failure` the container keeps restarting; `docker logs
# march-tessera` shows the reason (it names TESSERA_CLIENT_KEYS_FILE).
#
# With TESSERA_GITHUB_APP_ID and TESSERA_GITHUB_APP_KEY_FILE set (and the key
# file present in the container), the github-app provider is registered and
# `app` token requests mint installation tokens scoped to the one requested
# repository and the access level's fixed permissions. If GitHub is down at
# startup the service still starts, with the provider `degraded` in /status.
# Without them, the service still starts, reports health and status, and fails
# `app` token requests with `provider_unconfigured`.
#
# HOST-SPECIFIC CONFIG (override via env or a .env file next to this compose):
#   MARCH_TESSERA_PORT    API port (default: deterministic 9477).
#   MARCH_OTEL            exports metrics/spans/OTLP logs to the observability
#                         stack. Defaults to 1 here, like every other March
#                         service compose; set MARCH_OTEL=0 to make telemetry a
#                         no-op. JSONL logs stay available either way in the
#                         march-tessera-logs volume.
#
# GITHUB APP SETTINGS (all optional and default to empty; setting the app id
# AND the key file enables minting, leaving either unset keeps the provider
# unconfigured):
#   TESSERA_GITHUB_APP_ID           the GitHub App's numeric id.
#   TESSERA_GITHUB_APP_KEY_FILE     path INSIDE the container to the App's
#                                   private key (PEM). Until the secret store
#                                   lands, add a read-only bind mount for that
#                                   one file yourself in a compose override.
#                                   Keep the host copy OUTSIDE $HOME: the other
#                                   March containers bind-mount the host HOME,
#                                   so a key under it is readable by all of
#                                   them.
#   TESSERA_GITHUB_INSTALLATION_ID  the App installation to mint tokens from.
#                                   When unset, the installation is looked up
#                                   per repository owner.
#
# ---------------------------------------------------------------------------
# NOT YET IN THIS CHANGE:
#   * Authorization policy is NOT enforced yet. Any registered client may
#     request a read or write bot token for any repository the App is
#     installed on, as either identity. The per-client policy file lands in the
#     next change.
#   * The secret store, `march up` generating client keys and writing this
#     client-keys file, and the full security notes arrive with a later change
#     (spec User Story 3).
#   * The port is published on 127.0.0.1 only. Never publish it on any other
#     interface, never expose it publicly, never publish this image.
# ---------------------------------------------------------------------------
name: march-tessera

services:
  tessera:
    build:
      context: ..
      dockerfile: docker/tessera.Dockerfile
    image: march-tessera:latest
    container_name: march-tessera
    restart: on-failure
    command: ["tessera", "serve", "--host", "0.0.0.0", "--port", "${MARCH_TESSERA_PORT:-9477}"]
    ports:
      - "127.0.0.1:${MARCH_TESSERA_PORT:-9477}:${MARCH_TESSERA_PORT:-9477}" # loopback only — never expose publicly
    environment:
      - MARCH_OTEL=${MARCH_OTEL:-1}
      - MARCH_OTEL_ENDPOINT=http://otel-lgtm:4318
      - MARCH_OTEL_SERVICE_NAME=march-tessera
      - MARCH_TESSERA_PORT=${MARCH_TESSERA_PORT:-9477}
      - MARCH_TESSERA_LOG_DIR=/march/logs
      # Required client-keys file (path inside the container). Passed through
      # empty when unset, in which case the service refuses to start.
      - TESSERA_CLIENT_KEYS_FILE=${TESSERA_CLIENT_KEYS_FILE:-}
      # Optional GitHub App pass-throughs; empty means unconfigured.
      - TESSERA_GITHUB_APP_ID=${TESSERA_GITHUB_APP_ID:-}
      - TESSERA_GITHUB_APP_KEY_FILE=${TESSERA_GITHUB_APP_KEY_FILE:-}
      - TESSERA_GITHUB_INSTALLATION_ID=${TESSERA_GITHUB_INSTALLATION_ID:-}
    volumes:
      # Durable service log file (also shipped to otel-lgtm via OTLP logs).
      - march-tessera-logs:/march/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${MARCH_TESSERA_PORT:-9477}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - march

networks:
  march:
    external: true
    name: march

volumes:
  march-tessera-logs:
